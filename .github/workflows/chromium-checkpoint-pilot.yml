name: Chromium exact-source checkpoint pilot
on:
  push:
    branches: [codex/chromium-parent-surface-fix]
    paths: [.github/workflows/chromium-checkpoint-pilot.yml]
  workflow_dispatch:
env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  TZ: UTC
permissions:
  contents: read
concurrency:
  group: chromium-checkpoint-pilot
  cancel-in-progress: false
jobs:
  create:
    name: Build one real object and seal checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      CHROMIUM_REVISION: '0e66b94549a8bd85f03fbdf189b752d6e7b63c32'
      DEPOT_TOOLS_UPDATE: '0'
      EVIDENCE_DIR: ${{ github.workspace }}/.tmp/checkpoint-create-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fresh pinned Chromium and complete runtime dependencies
        timeout-minutes: 50
        run: bash .github/scripts/chromium-validation-bootstrap.sh
      - name: Prepare identical diagnostics and source identity
        timeout-minutes: 5
        run: bash .github/scripts/chromium-checkpoint-pilot-prepare.sh
      - name: Prove tiny Linux Siso restore and changed-source controls
        timeout-minutes: 3
        run: |
          python3 .github/scripts/checkpoint-pilot.py \
            --siso "$CHROMIUM_SRC/third_party/siso/cipd/siso" \
            --checkpoint-helper "$GITHUB_WORKSPACE/.github/scripts/chromium-checkpoint.py" \
            --result "$EVIDENCE_DIR/linux-tiny-pilot.json"
      - name: Generate matched Release graph and build only the known narrow object
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          cd "$CHROMIUM_SRC"
          buildtools/linux64/gn gen out/Paired --args="$PILOT_GN_ARGS" 2>&1 | tee "$EVIDENCE_DIR/gn.log"
          cp out/Paired/args.gn "$EVIDENCE_DIR/args.gn"
          test -f "$PILOT_SOURCE"
          autoninja -C out/Paired -j 4 "$PILOT_OBJECT" 2>&1 | tee "$EVIDENCE_DIR/initial-object-build.log"
          test -s "out/Paired/$PILOT_OBJECT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['CHROMIUM_SRC'])/'out/Paired'/os.environ['PILOT_OBJECT']
          r={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size,'mtime_ns':p.stat().st_mtime_ns}
          pathlib.Path(os.environ['EVIDENCE_DIR'],'initial-object.json').write_text(json.dumps(r,indent=2))
          PY
      - name: Seal stopped real graph with bounded archive and source stamps
        timeout-minutes: 12
        shell: bash
        run: |
          python3 .github/scripts/chromium-checkpoint.py seal \
            --src "$CHROMIUM_SRC" --out out/Paired \
            --identity "$EVIDENCE_DIR/checkpoint-identity.json" \
            --checkpoint "$RUNNER_TEMP/chromium-checkpoint"
          cp "$RUNNER_TEMP/chromium-checkpoint/READY.json" "$EVIDENCE_DIR/checkpoint-size-and-hashes.json"
          # Pilot artifacts are much smaller than a full build; avoid accidental
          # multi-GB artifact storage. The8GiB transport ceiling remains separate.
          test "$(du -sb "$RUNNER_TEMP/chromium-checkpoint" | cut -f1)" -lt 268435456
          cp "$EVIDENCE_DIR/initial-object.json" "$RUNNER_TEMP/chromium-checkpoint/initial-object.json"
      - name: Transfer tiny checkpoint to a different fresh runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Chromium-exact-source-checkpoint-pilot
          path: ${{ runner.temp }}/chromium-checkpoint
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Preserve creation evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Chromium-checkpoint-create-evidence
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error
  resume:
    name: Restore on fresh runner and prove zero rebuild
    needs: create
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      CHROMIUM_REVISION: '0e66b94549a8bd85f03fbdf189b752d6e7b63c32'
      DEPOT_TOOLS_UPDATE: '0'
      EVIDENCE_DIR: ${{ github.workspace }}/.tmp/checkpoint-resume-evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Independent fresh pinned Chromium and complete runtime dependencies
        timeout-minutes: 50
        run: bash .github/scripts/chromium-validation-bootstrap.sh
      - name: Reapply identical diagnostics and independently calculate identity
        timeout-minutes: 5
        run: bash .github/scripts/chromium-checkpoint-pilot-prepare.sh
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Chromium-exact-source-checkpoint-pilot
          path: ${{ runner.temp }}/chromium-checkpoint
      - name: Verify full source content and restore exact graph/output timestamps
        timeout-minutes: 15
        shell: bash
        run: |
          python3 .github/scripts/chromium-checkpoint.py restore \
            --src "$CHROMIUM_SRC" --out out/Paired \
            --identity "$EVIDENCE_DIR/checkpoint-identity.json" \
            --checkpoint "$RUNNER_TEMP/chromium-checkpoint" \
            2>&1 | tee "$EVIDENCE_DIR/restore.log"
      - name: Same real object must require zero executed actions
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cd "$CHROMIUM_SRC"
          autoninja -C out/Paired -j 4 "$PILOT_OBJECT" 2>&1 | tee "$EVIDENCE_DIR/resumed-object-build.log"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          evidence=pathlib.Path(os.environ['EVIDENCE_DIR'])
          log=(evidence/'resumed-object-build.log').read_text()
          assert re.search(r'Build Succeeded:\s+0 steps',log), 'Siso did not prove zero executed actions'
          p=pathlib.Path(os.environ['CHROMIUM_SRC'])/'out/Paired'/os.environ['PILOT_OBJECT']
          actual={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'size':p.stat().st_size,'mtime_ns':p.stat().st_mtime_ns}
          expected=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'chromium-checkpoint/initial-object.json').read_text())
          assert actual==expected, ('Object changed during supposed no-op',actual,expected)
          (evidence/'real-object-noop-validation.json').write_text(json.dumps({'status':'pass','zeroExecutedActions':True,'object':actual},indent=2))
          PY
      - name: Changed real source must be rejected before timestamp normalization
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['CHROMIUM_SRC'])/os.environ['PILOT_SOURCE']
          p.write_bytes(p.read_bytes()+b'\n// checkpoint rejection negative control\n')
          PY
          set +e
          python3 .github/scripts/chromium-checkpoint.py restore \
            --src "$CHROMIUM_SRC" --out out/Paired \
            --identity "$EVIDENCE_DIR/checkpoint-identity.json" \
            --checkpoint "$RUNNER_TEMP/chromium-checkpoint" \
            > "$EVIDENCE_DIR/changed-source-rejection.log" 2>&1
          rejection_status=$?
          set -e
          test "$rejection_status" -eq 1
          grep -F 'Checkpoint content mismatch:' "$EVIDENCE_DIR/changed-source-rejection.log"
          grep -F "'$PILOT_SOURCE'" "$EVIDENCE_DIR/changed-source-rejection.log"
          printf '{"status":"pass","changedRealSourceRejected":true}\n' > "$EVIDENCE_DIR/changed-source-validation.json"
      - name: Preserve all resume evidence including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Chromium-checkpoint-resume-evidence
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error
